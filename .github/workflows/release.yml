name: release-builds

on:
  release:
    types: [published]
  workflow_dispatch:

defaults:
  run:
    working-directory: app_flutter

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          # The module lives in server/, and setup-go looks for go.sum at the
          # repo ROOT — so its build cache silently never restored ("Restore
          # cache failed: Dependencies file is not found"). Pointing it at the
          # real file is the whole fix.
          cache-dependency-path: server/go.sum
      - name: Go tests
        working-directory: server
        run: go test ./...
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter tests
        run: flutter test
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tui
      - name: TUI tests
        working-directory: tui
        # Unit and rendering tests; the live ones below need a server and skip
        # themselves without ARIA_TEST_SERVER. No lint gate here, matching the
        # Go and Flutter steps — a new clippy lint must not block a release.
        run: cargo test
      - name: TUI tests against a live server
        working-directory: .
        # The one class of bug the offline tests cannot catch is the client and
        # the server disagreeing about the API. Both are in this repo, so the
        # real server is built and answered against: response shapes, the
        # playlist round-trip, and the play-timestamp layout the server parses
        # strictly.
        run: |
          set -euo pipefail
          (cd server && go build -o "$RUNNER_TEMP/aria-server" ./cmd/aria)
          MUSIC_DIR="$PWD/test-music" DATA_DIR="$RUNNER_TEMP/aria-data" PORT=3999 \
            "$RUNNER_TEMP/aria-server" &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 60); do
            # A dead server must fail here rather than let the loop run its
            # full timeout — or, worse, let something else answering on the
            # port look like readiness.
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "aria server exited before becoming ready" >&2
              exit 1
            fi
            if curl -fsS http://127.0.0.1:3999/healthz >/dev/null 2>&1; then
              ready=1; break
            fi
            sleep 0.5
          done
          if [ "${ready:-}" != 1 ]; then
            echo "aria server did not become ready on :3999" >&2
            exit 1
          fi
          cd tui && ARIA_TEST_SERVER=http://127.0.0.1:3999 cargo test --test live

  docker:
    if: github.event_name == 'release'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Build and push image
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build --build-arg "VERSION=${GITHUB_REF_NAME#v}" -t "$IMAGE:$GITHUB_REF_NAME" .
          docker push "$IMAGE:$GITHUB_REF_NAME"
          # ponytail: :latest only for real releases so a pre-release can't move it
          if [ "${{ github.event.release.prerelease }}" != "true" ]; then
            docker tag "$IMAGE:$GITHUB_REF_NAME" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi

  linux:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install build deps
        # ponytail: bundle_libmpv.sh is dnf-only; on CI we ship against apt's libmpv
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libmpv-dev mpv patchelf
      - run: flutter build linux --release
      - name: Package tarball
        run: tar -C build/linux/x64/release/bundle -czf aria-linux-x64.tar.gz .
      - name: Package AppImage
        # appimagetool is itself an AppImage and the runners have no FUSE.
        # ponytail: the `continuous` build is upstream's recommended download and
        # the one whose embedded runtime is static, so users need no libfuse2.
        # That leaves it unpinned — pin a tag if a bad build ever lands.
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
          APPIMAGETOOL="$RUNNER_TEMP/appimagetool" bash ../packaging/appimage/build.sh
          # The silent failure mode is libmpv landing anywhere other than the
          # path mpv_ffi.dart dlopens: the app starts fine and plays nothing.
          ./aria-linux-x86_64.AppImage --appimage-extract >/dev/null
          test -x squashfs-root/usr/bin/aria
          test -f squashfs-root/usr/bin/lib/libmpv.so
      - name: Upload to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            aria-linux-x64.tar.gz aria-linux-x86_64.AppImage --clobber

  flatpak:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install flatpak tooling + runtime
        # The .flatpak bundle carries only the app; libmpv/libplacebo/libass are
        # built from source inside the Sdk sandbox by the manifest. The runtime
        # itself is resolved from flathub on the user's machine at install time.
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder \
            ninja-build libgtk-3-dev libmpv-dev mpv
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08
      - name: Build Flutter bundle
        # The manifest packages this host-built bundle (source: type dir).
        run: flutter build linux --release
      - name: Build flatpak bundle
        working-directory: .
        # ponytail: build from source each release, no flatpak-builder cache.
        # Adds ~10 min for mpv/libplacebo. Add actions/cache on .flatpak-builder
        # if the runtime becomes a bottleneck.
        run: |
          flatpak-builder --user --force-clean --repo=repo \
            build-flatpak packaging/flatpak/dev.aria.aria.yml
          flatpak build-bundle repo aria-linux-x64.flatpak dev.aria.aria
      - name: Upload to release
        if: github.event_name == 'release'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" aria-linux-x64.flatpak --clobber

  macos:
    needs: test
    runs-on: macos-latest
    # notarytool --wait is a blocking round-trip to Apple; cap it so a stuck
    # submission can't burn the 6-hour default.
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      APP: build/macos/Build/Products/Release/aria.app
    steps:
      - uses: actions/checkout@v7
      # connectivity_plus uses NWPath.isUltraConstrained (Xcode 26 SDK);
      # the runner's default Xcode is older, so select the latest stable.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter build macos --release
      # Xcode has already signed the app and every nested framework inside-out
      # with the ad-hoc identity (CODE_SIGN_IDENTITY = "-"), which is all an
      # un-notarized build can have. There is deliberately no `codesign --deep`
      # on top of that: Apple documents --deep as the wrong way to sign nested
      # code, and re-signing without --entitlements silently drops them.
      - name: Sign and notarize
        # Only on a real release — every manual run would otherwise queue a
        # submission with Apple and block on it.
        if: github.event_name == 'release'
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # `secrets` can't be referenced from a job-level `if`, so branch here.
          if [ -z "$P12" ]; then
            echo "no MACOS_CERTIFICATE_P12_BASE64 — shipping Xcode's ad-hoc"
            echo "signature. Gatekeeper quarantines the download; the README"
            echo "documents the xattr -dr the user runs once."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p '' "$KEYCHAIN"
          security unlock-keychain -p '' "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          # BSD base64 wants --decode; -d is not portable back from GNU.
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k '' "$KEYCHAIN" >/dev/null
          sign() {
            codesign --force --timestamp --options runtime \
              --keychain "$KEYCHAIN" -s "Developer ID Application" "$@"
          }
          # Inside-out, per Apple: nested code first, the bundle itself last.
          find "$APP/Contents" -name '*.dylib' -print0 |
            while IFS= read -r -d '' f; do sign "$f"; done
          # Versioned bundles must be signed at Versions/A, not the symlinked top.
          for fw in "$APP"/Contents/Frameworks/*.framework; do sign "$fw/Versions/A"; done
          sign "$APP"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --wait \
            --output-format json --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" \
            > "$RUNNER_TEMP/notary.json" || true
          # --wait exits non-zero with no reason; the rejection is only in the
          # log, so always print it. `stapler staple` below is the real gate —
          # it fails unless Apple accepted the submission.
          xcrun notarytool log "$(jq -r .id "$RUNNER_TEMP/notary.json")" \
            --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" || true
          # Staple the .app, not the zip: a zip carries no ticket, but a stapled
          # .app zipped afterwards launches offline. No .dmg needed.
          xcrun stapler staple "$APP"
      - name: Package
        run: ditto -c -k --keepParent "$APP" aria-macos.zip
      - name: Upload to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" aria-macos.zip --clobber

  ios:
    needs: test
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1   # see the macos job
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # media_kit_libs_ios_audio is CocoaPods-only and its podspec shells out to
      # `make` during pod install, fetching a sha256-checked libmpv xcframework
      # from GitHub releases. `flutter build` drives that; it only needs network.
      - run: flutter build ios --release --no-codesign
      # ponytail: an unsigned .ipa, re-signed by the user at install time.
      # Shipping an installable one is not a secrets problem — iOS has no
      # Developer ID equivalent, so it would need an Apple Distribution cert
      # plus a provisioning profile naming every user's device UDID. README
      # points at AltStore/Sideloadly, which re-sign with a free Apple ID.
      - name: Package
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry aria-ios-unsigned.ipa Payload
      - name: Upload to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" aria-ios-unsigned.ipa --clobber

  android:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/aria-release.jks"
      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/aria-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: flutter build apk --release
      - name: Upload to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk aria-android.apk
          gh release upload "$GITHUB_REF_NAME" aria-android.apk --clobber

  # The terminal client. A self-contained Rust binary: it needs no libmpv at
  # build time (mpv is launched as a child process at runtime), so unlike the
  # Flutter jobs this one installs nothing beyond the toolchain.
  #
  # Unix only — playback talks to mpv over a unix socket, so there is no
  # Windows target to build.
  tui:
    needs: test
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      # One platform failing should not deny the other its artifact.
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            asset: aria-tui-linux-x64.tar.gz
            targets: ""
          - runner: macos-latest
            asset: aria-tui-macos.zip
            # Built for both architectures and merged, so one download serves
            # Intel and Apple silicon.
            targets: x86_64-apple-darwin,aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tui
      - name: Build (Linux)
        if: runner.os == 'Linux'
        working-directory: tui
        run: |
          set -euo pipefail
          cargo build --release
          ./target/release/aria-tui --version
          tar -C target/release -czf "${{ matrix.asset }}" aria-tui
      - name: Build (macOS universal)
        if: runner.os == 'macOS'
        working-directory: tui
        run: |
          set -euo pipefail
          cargo build --release --target x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          lipo -create -output aria-tui \
            target/x86_64-apple-darwin/release/aria-tui \
            target/aarch64-apple-darwin/release/aria-tui
          # Confirms the merged binary runs on the runner's own architecture;
          # `lipo -info` covers that the other slice is present at all.
          ./aria-tui --version
          lipo -info aria-tui
          zip -q "${{ matrix.asset }}" aria-tui
      - name: Upload to release
        if: github.event_name == 'release'
        working-directory: tui
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "${{ matrix.asset }}" --clobber
