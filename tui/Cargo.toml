[package]
name = "aria-tui"
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
description = "Terminal client for the Aria music server"
license = "MIT"

[[bin]]
name = "aria-tui"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["rustls", "json"] }
toml = "0.9"
dirs = "6"

[profile.release]
lto = true
strip = true
codegen-units = 1

[dev-dependencies]
ureq = { version = "3", features = ["rustls", "json"] }
